services:
  mariadb:
    build: ./requirements/mariadb
    image: mariadb:42
    container_name: mariadb
    restart: always
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
    secrets:
      - db_root_password
      - db_password
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception-net

  redis:
    build: ./requirements/bonus/redis
    image: redis:42
    container_name: redis
    restart: always
    networks:
      - inception-net

  wordpress:
    build: ./requirements/wordpress
    image: wordpress:42
    container_name: wordpress
    restart: always
    depends_on:
      - mariadb
      - redis
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - WP_TITLE=${WP_TITLE}
      - WP_ADMIN_USER=${WP_ADMIN_USER}
      - WP_ADMIN_EMAIL=${WP_ADMIN_EMAIL}
      - WP_USER=${WP_USER}
      - WP_USER_EMAIL=${WP_USER_EMAIL}
    secrets:
      - db_password
      - wp_admin_password
      - wp_user_password
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception-net

  ftp:
    build: ./requirements/bonus/ftp
    image: ftp:42
    container_name: ftp
    restart: always
    depends_on:
      - wordpress
    environment:
      - FTP_USER=${FTP_USER:-ftpuser}
    secrets:
      - ftp_password
    ports:
      - "21:21"
      - "21100-21105:21100-21105"
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception-net

  static_site:
    build: ./requirements/bonus/static_site
    image: static_site:42
    container_name: static_site
    restart: always
    networks:
      - inception-net

  adminer:
    build: ./requirements/bonus/adminer
    image: adminer:42
    container_name: adminer
    restart: always
    depends_on:
      - mariadb
    networks:
      - inception-net

  cadvisor:
    build: ./requirements/bonus/cadvisor
    image: cadvisor:42
    container_name: cadvisor
    restart: always
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - inception-net

  nginx:
    build: ./requirements/nginx
    image: nginx:42
    container_name: nginx
    restart: always
    depends_on:
      - wordpress
      - static_site
      - adminer
      - cadvisor
    ports:
      - "443:443"
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME}
    volumes:
      - wordpress_data:/var/www/html:ro
    networks:
      - inception-net

secrets:
  db_root_password:
    file: ../secrets/db_root_password.txt
  db_password:
    file: ../secrets/db_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt
  ftp_password:
    file: ../secrets/ftp_password.txt

volumes:
  mariadb_data:
    name: mariadb_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/aarid/data/mariadb
  wordpress_data:
    name: wordpress_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/aarid/data/wordpress

networks:
  inception-net:
    name: inception-net
    driver: bridge
