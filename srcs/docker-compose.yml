services:
  mariadb:
    build: ./requirements/mariadb
    container_name: mariadb
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
    secrets:
      - db_root_password
      - db_password
    volumes:
      - mariadb_data:/var/lib/mysq
    networks:
      - inception-net
    restart: on-failure

secrets:
  db_root_password:
    file: ../secrets/db_root_password.txt
  db_password:
    file: ../secrets/db_password.txt

volumes:
  mariadb_data:
    driver: local # use Docker's built-in local volume driver (default anyway)
    driver_opts:
      type: none # not a network filesystem — just a plain local mount
      device: /home/out/data/mariadb
      o: bind

networks:
  inception-net:
    driver: bridge
