worker_processes auto;
events {
	worker_connections 512;
}

http {
    include /etc/nginx/mime.types;

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name aarid.42.fr;

        ssl_certificate     /etc/ssl/certs/inception.crt;
        ssl_certificate_key /etc/ssl/private/inception.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        root /var/www/html;
        index index.php index.html index.htm;

        # Static Showcase / Portfolio
        # Redirecting request without '/'
        location = /portfolio {
            return 301 /portfolio/;
        }

        location /portfolio/ {
            proxy_pass http://static_site:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Adminer Database Manager
        location = /adminer {
            return 301 /adminer/;
        }

        location /adminer/ {
            proxy_pass http://adminer:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # cAdvisor Container Telemetry
        location = /cadvisor {
            return 301 /cadvisor/;
        }

        location /cadvisor/ {
            proxy_pass http://cadvisor:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect ~^/(.*) /cadvisor/$1;
        }

        # WordPress Root and Permalinks
        location / {
            try_files $uri $uri/ /index.php?$args;
        }

        # WordPress PHP-FPM FastCGI Handler
        location ~ \.php$ {
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass wordpress:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
        }
    }
}
