# Basic Server
listen=YES
# allow Linux system users created in the container to log in.
local_enable=YES
write_enable=YES

# Point User Directly to WordPress Volume &amp; Lock Them In
local_root=/var/www/html
chroot_local_user=YES
allow_writeable_chroot=YES

# Minimal Docker Passive Mode
pasv_enable=YES
pasv_min_port=21100
pasv_max_port=21105

# Address to ask client to connect to
pasv_address=127.0.0.1
